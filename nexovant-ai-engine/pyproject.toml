[project]
name = "nexovant-ai-engine"
version = "1.0.0"
description = "Nexovant Cognitive Engine: Multi-Provider AI Router, RAG & Executive Reporting"
authors = [
    { name = "Nexovant Core Architecture Team", email = "engineering@nexovant.si" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.27.2",
    "asyncpg>=0.30.0",
    "sqlalchemy>=2.0.36",
    "pgvector>=0.3.5",
    "reportlab>=4.2.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = "test_*.py"

[tool.ruff]
line-length = 100
target-version = "py312"
