user nginx;
worker_processes auto;
pid /var/run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging format with request timing and upstream response latency
    log_format executive_combined '$remote_addr - $remote_user [$time_local] '
                                  '"$request" $status $body_bytes_sent '
                                  '"$http_referer" "$http_user_agent" '
                                  'rt=$request_time uct="$upstream_connect_time" uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log executive_combined;

    # Performance & Network Tuning
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Client limits (Prevent payload exhaustion on 1 vCPU VPS)
    client_max_body_size 12M;
    client_body_buffer_size 128k;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Rate Limiting Zones (Memory-conscious for 4GB VPS)
    limit_req_zone $binary_remote_addr zone=api_general_zone:10m rate=60r/m;
    limit_req_zone $binary_remote_addr zone=api_auth_zone:10m rate=10r/m;

    # Upstream PHP-FPM Service (Laravel Backend)
    upstream laravel_backend {
        server backend:9000 max_fails=3 fail_timeout=10s;
        keepalive 16;
    }

    # Upstream Python FastAPI Service (Internal AI Engine)
    upstream python_ai_engine {
        server ai-engine:8000 max_fails=3 fail_timeout=10s;
        keepalive 8;
    }

    # Main Server Block
    server {
        listen 80;
        listen [::]:80;
        server_name api.nexovant.si localhost;

        # Cloudflare / Proxy Real IP Forwarding
        set_real_ip_from 173.245.48.0/20;
        set_real_ip_from 103.21.244.0/22;
        set_real_ip_from 103.22.200.0/22;
        set_real_ip_from 103.31.4.0/22;
        set_real_ip_from 141.101.64.0/18;
        set_real_ip_from 108.162.192.0/18;
        set_real_ip_from 190.93.240.0/20;
        set_real_ip_from 188.114.96.0/20;
        set_real_ip_from 197.234.240.0/22;
        set_real_ip_from 198.41.128.0/17;
        set_real_ip_from 162.158.0.0/15;
        set_real_ip_from 104.16.0.0/13;
        set_real_ip_from 104.24.0.0/14;
        set_real_ip_from 172.64.0.0/13;
        set_real_ip_from 131.0.72.0/22;
        real_ip_header CF-Connecting-IP;

        # Security Headers
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

        root /var/www/nexovant-backend/public;
        index index.php index.html;

        # Health Check Endpoint for Load Balancers & Hostinger Monitors
        location = /healthz {
            access_log off;
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }

        # Public Laravel REST API Routes
        location /api/v1/ {
            limit_req zone=api_general_zone burst=20 nodelay;
            try_files $uri $uri/ /index.php?$query_string;
        }

        # Stricter Rate-Limiting on Auth Endpoints
        location /api/v1/auth/ {
            limit_req zone=api_auth_zone burst=5 nodelay;
            try_files $uri $uri/ /index.php?$query_string;
        }

        # FastCGI Configuration for PHP-FPM
        location ~ \.php$ {
            fastcgi_split_path_info ^(.+\.php)(/.+)$;
            fastcgi_pass laravel_backend;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            fastcgi_param DOCUMENT_ROOT $realpath_root;
            fastcgi_param HTTP_PROXY ""; # Mitigate HTTPOXY vulnerability
            fastcgi_intercept_errors off;
            fastcgi_buffer_size 16k;
            fastcgi_buffers 4 16k;
            fastcgi_connect_timeout 10s;
            fastcgi_send_timeout 60s;
            fastcgi_read_timeout 60s;
        }

        # BLOCK EXTERNAL ACCESS TO INTERNAL AI SERVICE
        # Internal AI engine is strictly accessible inside Docker or via Backend service calls
        location /api/internal/ {
            deny all;
            return 403 "Forbidden: Internal AI Service is inaccessible directly.\n";
        }

        # Deny hidden files (.git, .env)
        location ~ /\.(?!well-known).* {
            deny all;
            access_log off;
            log_not_found off;
        }
    }
}
